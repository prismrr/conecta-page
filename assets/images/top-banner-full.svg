<svg xmlns="http://www.w3.org/2000/svg" width="1920" height="360" viewBox="0 0 1920 360" role="img" aria-labelledby="title desc" preserveAspectRatio="xMidYMid slice">
  <title id="title">Banner superior Conecta PrismRR</title>
  <desc id="desc">Imagem horizontal decorativa com degradês e formas geométricas em azul, laranja e turquesa.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0f1445"/>
      <stop offset="55%" stop-color="#151b5f"/>
      <stop offset="100%" stop-color="#0b1037"/>
