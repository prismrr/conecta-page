services:
  conecta-build:
    image: node:20-bullseye
    working_dir: /workspace
    entrypoint: ["/bin/bash", "-lc"]
    command:
      - >-
        apt-get update
        && apt-get install -y --no-install-recommends python3 python3-pip
        && rm -rf /var/lib/apt/lists/*
        && npm ci
        && python3 -m pip install --no-cache-dir -r backend/requirements-fastapi.txt
        && python3 -m py_compile backend/api/__init__.py backend/api/config.py backend/api/deps.py backend/api/errors.py backend/api/main.py backend/api/schemas.py backend/api/schemas_compliance.py backend/api/storage.py backend/api/services/__init__.py backend/api/services/compliance.py backend/api/services/registrations.py backend/api/routers/__init__.py backend/api/routers/compliance.py backend/api/routers/health.py backend/api/routers/observability.py backend/api/routers/registrations.py
        && bash backend/deploy/build_static_inside_container.sh
    volumes:
      - ./:/workspace
    profiles:
      - build

  conecta-local:
    image: python:3.11-slim
    container_name: conecta-local
    working_dir: /workspace
    command: ["python3", "backend/server/dev_server.py", "--host", "0.0.0.0", "--port", "8080"]
    env_file:
      - .env
    ports:
      - "8080:8080"
    volumes:
      - ./:/workspace
    environment:
      PYTHONUNBUFFERED: "1"
      TELEMETRY_FORWARD_URL: ${TELEMETRY_FORWARD_URL:-}
      TELEMETRY_FORWARD_PROVIDER: ${TELEMETRY_FORWARD_PROVIDER:-raw}
      TELEMETRY_FORWARD_AUTH_TYPE: ${TELEMETRY_FORWARD_AUTH_TYPE:-none}
      TELEMETRY_FORWARD_AUTH_TOKEN: ${TELEMETRY_FORWARD_AUTH_TOKEN:-}
      TELEMETRY_FORWARD_AUTH_HEADER: ${TELEMETRY_FORWARD_AUTH_HEADER:-X-API-Key}
      TELEMETRY_FORWARD_USERNAME: ${TELEMETRY_FORWARD_USERNAME:-}
      TELEMETRY_FORWARD_PASSWORD: ${TELEMETRY_FORWARD_PASSWORD:-}
      TELEMETRY_FORWARD_TIMEOUT_SECONDS: ${TELEMETRY_FORWARD_TIMEOUT_SECONDS:-3}
