services:
  conecta-build:
    image: node:20-bookworm
    working_dir: /workspace
    entrypoint: ["/bin/bash", "-lc"]
    command:
      - >-
        apt-get update
        && apt-get install -y --no-install-recommends python3 python3-pip
        && rm -rf /var/lib/apt/lists/*
        && python3 --version
        && npm ci
        && python3 -m pip install --no-cache-dir -r backend/requirements-fastapi.txt
        && python3 -m py_compile backend/api/__init__.py backend/api/config.py backend/api/deps.py backend/api/errors.py backend/api/main.py backend/api/schemas.py backend/api/schemas_compliance.py backend/api/schemas_telemetry.py backend/api/storage.py backend/api/sqlite_utils.py backend/api/services/__init__.py backend/api/services/compliance.py backend/api/services/inscricoes.py backend/api/services/registrations.py backend/api/services/telemetry.py backend/api/routers/__init__.py backend/api/routers/compliance.py backend/api/routers/health.py backend/api/routers/inscricoes.py backend/api/routers/observability.py backend/api/routers/registrations.py backend/api/routers/telemetry.py backend/ingestion/__init__.py backend/ingestion/celery_app.py backend/ingestion/tasks.py backend/fastapi_server.py backend/jobs/retention_job.py
        && python3 -c "import backend.api.main; import backend.ingestion.tasks"
        && python3 -m json.tool contracts/openapi/registration-result.v1.0.0.openapi.json >/dev/null
        && python3 -m json.tool contracts/openapi/inscricoes.v1.0.0.openapi.json >/dev/null
        && bash backend/deploy/build_static_inside_container.sh
    volumes:
      - ./:/workspace
    profiles:
      - build

  conecta-local:
    image: python:3.11-slim
    container_name: conecta-local
    working_dir: /workspace
    entrypoint: ["/bin/bash", "-lc"]
    command:
      - >-
        python3 -m pip install --no-cache-dir -r backend/requirements-fastapi.txt
        && python3 backend/fastapi_server.py --host 0.0.0.0 --port 8080
    env_file:
      - .env
    ports:
      - "8080:8080"
    volumes:
      - ./:/workspace
    environment:
      PYTHONUNBUFFERED: "1"
      FASTAPI_RUNTIME: "1"
      TELEMETRY_FORWARD_URL: ${TELEMETRY_FORWARD_URL:-}
      TELEMETRY_FORWARD_PROVIDER: ${TELEMETRY_FORWARD_PROVIDER:-raw}
      TELEMETRY_FORWARD_AUTH_TYPE: ${TELEMETRY_FORWARD_AUTH_TYPE:-none}
      TELEMETRY_FORWARD_AUTH_TOKEN: ${TELEMETRY_FORWARD_AUTH_TOKEN:-}
      TELEMETRY_FORWARD_AUTH_HEADER: ${TELEMETRY_FORWARD_AUTH_HEADER:-X-API-Key}
      TELEMETRY_FORWARD_USERNAME: ${TELEMETRY_FORWARD_USERNAME:-}
      TELEMETRY_FORWARD_PASSWORD: ${TELEMETRY_FORWARD_PASSWORD:-}
      TELEMETRY_FORWARD_TIMEOUT_SECONDS: ${TELEMETRY_FORWARD_TIMEOUT_SECONDS:-3}

  conecta-redis:
    image: redis:7-alpine
    container_name: conecta-redis
    command: ["redis-server", "--save", "", "--appendonly", "no"]
    ports:
      - "6379:6379"
    profiles:
      - ingestion

  conecta-csv-source:
    image: python:3.11-slim
    container_name: conecta-csv-source
    working_dir: /workspace/data
    command: ["python3", "-m", "http.server", "8090", "--bind", "0.0.0.0"]
    ports:
      - "8090:8090"
    volumes:
      - ./:/workspace
    profiles:
      - ingestion

  conecta-worker:
    image: python:3.11-slim
    container_name: conecta-worker
    working_dir: /workspace
    entrypoint: ["/bin/bash", "-lc"]
    command:
      - >-
        python3 -m pip install --no-cache-dir -r backend/requirements-fastapi.txt
        && celery -A backend.ingestion.celery_app.celery_app worker --loglevel=INFO -Q ingestao_csv
    volumes:
      - ./:/workspace
    environment:
      PYTHONUNBUFFERED: "1"
      CONECTA_COMPLIANCE_DB_FILE: /workspace/data/compliance.db
      CONECTA_INSCRICOES_CSV_URL: ${CONECTA_INSCRICOES_CSV_URL:-http://conecta-csv-source:8090/inscricoes-seed.csv}
      CONECTA_CELERY_BROKER_URL: ${CONECTA_CELERY_BROKER_URL:-redis://conecta-redis:6379/0}
      CONECTA_CELERY_RESULT_BACKEND: ${CONECTA_CELERY_RESULT_BACKEND:-redis://conecta-redis:6379/0}
      CONECTA_PII_FERNET_KEY: ${CONECTA_PII_FERNET_KEY:-YWFhYWFhYWFhYWFhYWFhYWFhYWFhYWFhYWFhYWFhYWE=}
    depends_on:
      - conecta-redis
      - conecta-csv-source
    profiles:
      - ingestion

  conecta-beat:
    image: python:3.11-slim
    container_name: conecta-beat
    working_dir: /workspace
    entrypoint: ["/bin/bash", "-lc"]
    command:
      - >-
        python3 -m pip install --no-cache-dir -r backend/requirements-fastapi.txt
        && celery -A backend.ingestion.celery_app.celery_app beat --loglevel=INFO
    volumes:
      - ./:/workspace
    environment:
      PYTHONUNBUFFERED: "1"
      CONECTA_INSCRICOES_CSV_URL: ${CONECTA_INSCRICOES_CSV_URL:-http://conecta-csv-source:8090/inscricoes-seed.csv}
      CONECTA_CELERY_BROKER_URL: ${CONECTA_CELERY_BROKER_URL:-redis://conecta-redis:6379/0}
      CONECTA_CELERY_RESULT_BACKEND: ${CONECTA_CELERY_RESULT_BACKEND:-redis://conecta-redis:6379/0}
      CONECTA_PII_FERNET_KEY: ${CONECTA_PII_FERNET_KEY:-YWFhYWFhYWFhYWFhYWFhYWFhYWFhYWFhYWFhYWFhYWE=}
    depends_on:
      - conecta-redis
      - conecta-csv-source
    profiles:
      - ingestion

