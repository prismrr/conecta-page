name: CI

on:
  pull_request:
  push:
    branches:
      - develop
      - main

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Run secret scanning (Gitleaks)
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browser
        run: npx playwright install --with-deps chromium

      - name: Validate privacy inventory gate
        run: npm run compliance:privacy:inventory

      - name: Upload privacy inventory report
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: privacy-inventory-report-ci
          retention-days: 30
          path: |
            logs/privacy-data-report.md
            logs/privacy-data-report.json
          if-no-files-found: error

      - name: Run CI test flow
        run: npm run ci:tests

      - name: Upload incident drill evidence
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: compliance-incident-drill-evidence-ci
          retention-days: 30
          path: |
            logs/compliance-incident-drill-report.json
            logs/compliance-incident-drill-summary.md
            data/compliance.db
          if-no-files-found: error

      - name: Upload Playwright artifacts on failure
        if: ${{ failure() }}
        uses: actions/upload-artifact@v4
        with:
          name: playwright-artifacts
          retention-days: 7
          path: |
            playwright-report/
            test-results/
          if-no-files-found: ignore

      - name: Build sanitized telemetry artifact on failure
        if: ${{ failure() }}
        run: |
          mkdir -p artifacts
          python3 - <<'PY'
          import json
          from pathlib import Path

          source = Path("logs/telemetry-events.ndjson")
          output = Path("artifacts/telemetry-sanitized.ndjson")
          summary = Path("artifacts/telemetry-summary.json")

          event_counts = {}
          sanitized_count = 0

          if source.exists():
            with source.open("r", encoding="utf-8") as src, output.open("w", encoding="utf-8") as dst:
              for line in src:
                line = line.strip()
                if not line:
                  continue
                try:
                  entry = json.loads(line)
                except json.JSONDecodeError:
                  continue

                payload = entry.get("payload") or {}
                event_name = payload.get("event", "unknown")
                event_counts[event_name] = event_counts.get(event_name, 0) + 1

                data = payload.get("data") or {}
                sanitized = {
                  "receivedAt": entry.get("receivedAt"),
                  "clientIp": "redacted",
                  "event": event_name,
                  "page": payload.get("page"),
                  "path": payload.get("path"),
                  "environment": payload.get("environment"),
                  "release_id": payload.get("release_id"),
                  "outcome": data.get("outcome"),
                  "reason": data.get("reason")
                }
                dst.write(json.dumps(sanitized, ensure_ascii=True) + "\n")
                sanitized_count += 1

          summary_payload = {
            "source_exists": source.exists(),
            "sanitized_records": sanitized_count,
            "event_counts": event_counts
          }
          summary.write_text(json.dumps(summary_payload, ensure_ascii=True, indent=2), encoding="utf-8")
          PY

      - name: Upload sanitized telemetry logs on failure
        if: ${{ failure() }}
        uses: actions/upload-artifact@v4
        with:
          name: telemetry-logs-sanitized
          retention-days: 7
          path: |
            artifacts/telemetry-sanitized.ndjson
            artifacts/telemetry-summary.json
          if-no-files-found: ignore

  appsec:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      security-events: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Run SAST (Semgrep)
        uses: returntocorp/semgrep-action@v1
        with:
          config: p/security-audit

      - name: Run SCA (OSV Scanner)
        uses: google/osv-scanner-action/osv-scanner-action@v2.3.8
        with:
          scan-args: -r .

  dast:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    needs:
      - test
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Start static server
        run: |
          python -m http.server 8080 --directory . >/tmp/conecta-http.log 2>&1 &
          echo "SERVER_PID=$!" >> "$GITHUB_ENV"

      - name: Wait for server readiness
        run: |
          for i in {1..20}; do
            if curl -fsS http://127.0.0.1:8080/ >/dev/null; then
              exit 0
            fi
            sleep 1
          done
          echo "Static server did not become ready in time" >&2
          exit 1

      - name: Run DAST baseline (OWASP ZAP)
        uses: zaproxy/action-baseline@v0.14.0
        with:
          target: "http://127.0.0.1:8080"
          fail_action: true
          allow_issue_writing: false
          artifact_name: zap-baseline-report
          cmd_options: "-a -m 5"

      - name: Upload static server log on failure
        if: ${{ failure() }}
        uses: actions/upload-artifact@v4
        with:
          name: dast-server-log
          retention-days: 7
          path: /tmp/conecta-http.log
          if-no-files-found: ignore

      - name: Stop static server
        if: ${{ always() }}
        run: |
          if [ -n "${SERVER_PID:-}" ]; then
            kill "$SERVER_PID" || true
          fi

  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs:
      - test
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Run CI build flow
        run: npm run ci:build

      - name: Upload static build artifact
        uses: actions/upload-artifact@v4
        with:
          name: nuxt-static-build
          retention-days: 7
          path: nuxt-app/.output/public
          if-no-files-found: error
