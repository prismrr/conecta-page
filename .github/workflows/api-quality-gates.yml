name: API Quality Gates

on:
  workflow_dispatch:
    inputs:
      base_url:
        description: Base URL da API alvo
        required: false
        default: ""
      openapi_file:
        description: Caminho do contrato OpenAPI no repositório
        required: true
        default: contracts/openapi/inscricoes.v1.0.0.openapi.json

jobs:
  functional-karate-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install FastAPI runtime dependencies
        run: python -m pip install --upgrade pip && python -m pip install -r backend/requirements-fastapi.txt

      - name: Start local FastAPI for Karate smoke
        run: |
          CONECTA_COMPLIANCE_DB_FILE="$PWD/data/compliance-karate-smoke-ci.db" \
          python -m backend.fastapi_server --host 127.0.0.1 --port 8080 >/tmp/conecta-api-karate-smoke.log 2>&1 &
          echo "API_PID=$!" >> "$GITHUB_ENV"

      - name: Wait for API readiness
        run: |
          for i in {1..60}; do
            if curl -fsS http://127.0.0.1:8080/healthz >/dev/null; then
              exit 0
            fi
            sleep 1
          done
          echo "FastAPI did not become ready in time" >&2
          exit 1

      - name: Run Karate smoke suite
        run: |
          cd tests/api/karate
          mvn -q test -DbaseUrl="http://127.0.0.1:8080" -Dkarate.tags=@smoke

      - name: Upload Karate smoke report
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: karate-report-smoke
          retention-days: 14
          path: |
            tests/api/karate/target/surefire-reports
            tests/api/karate/target/karate-reports
          if-no-files-found: ignore

      - name: Upload FastAPI smoke log on failure
        if: ${{ failure() }}
        uses: actions/upload-artifact@v4
        with:
          name: karate-fastapi-log-smoke
          retention-days: 14
          path: /tmp/conecta-api-karate-smoke.log
          if-no-files-found: ignore

      - name: Stop local FastAPI
        if: ${{ always() }}
        run: |
          if [ -n "${API_PID:-}" ]; then
            kill "$API_PID" || true
          fi

