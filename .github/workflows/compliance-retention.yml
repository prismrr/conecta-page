name: Compliance Retention

on:
  workflow_dispatch:
  schedule:
    - cron: "15 3 * * *"

jobs:
  retention-job:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Run retention job (dry-run)
        run: |
          mkdir -p artifacts
          python3 backend/jobs/retention_job.py \
            --db-file data/compliance.db \
            --report-file artifacts/compliance-retention-report.json \
            --dry-run

      - name: Upload retention report
        uses: actions/upload-artifact@v4
        with:
          name: compliance-retention-report
          retention-days: 30
          path: artifacts/compliance-retention-report.json
          if-no-files-found: error
